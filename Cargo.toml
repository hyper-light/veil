[workspace]
members = ["crates/*"]
# vendor/ holds what Veil vendors (vendor/MANIFEST.toml), each project a workspace of its own.
exclude = ["vendor"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.99.1"
repository = "https://github.com/hyper-light/veil"
publish = false

# The no-panic rule and the rest of CLAUDE.md as lints. Production code is checked again by
# scripts/check-production.sh, without the test allowances.
[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
unreachable = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
string_slice = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"
disallowed_macros = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
undocumented_unsafe_blocks = "deny"
mem_forget = "deny"
exit = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
# A dependency's overflow unwinds to the boundary that contains it instead of wrapping into a wrong
# value; Veil's own arithmetic is checked and never reaches this.
overflow-checks = true
# Symbols for profilers; no effect on generated code.
debug = "line-tables-only"

[profile.bench]
inherits = "release"
